[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-room-runtime"
version = "0.2.0"
description = "Isolated, stateless Hermes job workers for Actverse Hub and Space"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Meapri" }]
dependencies = []

[project.scripts]
hermes-room-worker = "hermes_room_runtime.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["hermes_room_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
